<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MEDU — Hieroglyphs on the go</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-deep: #0E0A05;
    --bg-night: #15100A;
    --surface: #1A140C;
    --surface-2: #251B0F;
    --surface-3: #322516;
    --hairline: rgba(212, 162, 76, 0.18);
    --hairline-strong: rgba(212, 162, 76, 0.32);
    --sandstone: #E8D9B0;
    --papyrus: #F4E8C8;
    --gold: #D4A24C;
    --gold-bright: #E8C36E;
    --gold-deep: #8C6A2A;
    --gold-glow: rgba(232, 195, 110, 0.45);
    --lapis: #4A82B8;
    --terracotta: #B8552E;
    --text: #F4E8C8;
    --text-dim: #C9B68A;
    --text-mute: #A08D68;
    --text-faint: #9A8763;

    --font-display: "Cinzel", "Times New Roman", serif;
    --font-body: "Outfit", -apple-system, "Helvetica Neue", sans-serif;
    --font-glyph: "Noto Sans Egyptian Hieroglyphs", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0a0704;
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(212, 162, 76, 0.08), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(46, 92, 138, 0.07), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.83 0 0 0 0 0.65 0 0 0 0 0.30 0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.6;
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 0;
  }
  .glyph { font-family: var(--font-glyph); line-height: 1; }
  #root { position: relative; z-index: 1; }
  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea { font-family: inherit; color: inherit; }

  @keyframes glyphCarveIn {
    0% { opacity: 0; transform: scale(0.5); filter: blur(6px); }
    60% { opacity: 1; transform: scale(1.1); filter: blur(0); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 12px var(--gold-glow); }
    50% { text-shadow: 0 0 24px var(--gold-glow), 0 0 40px rgba(212, 162, 76, 0.3); }
  }

  .mobile-scroll::-webkit-scrollbar { display: none; }
  .mobile-scroll { scrollbar-width: none; -ms-overflow-style: none; }

  /* Respect the system "reduce motion" setting */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>

<!-- Data + helpers (shared with index.html) -->
<script src="data.js"></script>

<!-- App code: compiled from src/ — run `npm run build` after editing -->
<script src="dist/mobile.js"></script>

</body>
</html>
